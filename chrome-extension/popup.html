<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-light: #d1fae5;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            width: 320px;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-weight: 800;
            font-size: 18px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .version {
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            display: block;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .status-container {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 12px;
            border-radius: 12px;
            position: relative;
        }

        .status-header {
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--primary);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.4;
            }
        }

        .status-text {
            font-size: 12px;
            color: var(--text);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .btn-turbo {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            text-decoration: underline;
            cursor: pointer;
            padding: 4px;
        }

        .btn-link:hover {
            color: var(--text);
        }

        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-portal {
            flex-direction: column;
            padding: 10px 4px;
            font-size: 10px;
            gap: 4px;
        }

        .btn-portal span {
            font-size: 16px;
            font-weight: 900;
            display: block;
        }

        .btn-sh {
            background: #ffe164;
            color: #333;
        }

        .btn-sh:hover {
            background: #ffd700;
        }

        .btn-he {
            background: #ea2b2e;
            color: #fff;
        }

        .btn-he:hover {
            background: #c01a1d;
        }

        .btn-ej {
            background: #4f46e5;
            color: #fff;
        }

        .btn-ej:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span>🤖</span> Trio Assistant
            </div>
            <div class="version">v2.1-EXT</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-val" id="countVal">0</span>
                <span class="stat-label">Aktarılan</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="pageVal">0</span>
                <span class="stat-label">Sayfa</span>
            </div>
        </div>

        <div class="status-container">
            <div class="status-header">
                <span class="pulse"></span> CANLI DURUM
            </div>
            <div class="status-text" id="status">Hazır...</div>
        </div>

        <div class="actions">
            <div class="portal-grid">
                <button id="btnSahibindenSale" class="btn btn-portal btn-sh" style="grid-column: span 1;">
                    <span>S+</span> Satılık
                </button>
                <button id="btnSahibindenRent" class="btn btn-portal btn-sh" style="grid-column: span 1;">
                    <span>S-</span> Kiralık
                </button>
                <button id="btnHepsi" class="btn btn-portal btn-he">
                    <span>H</span> Hepsiemlak
                </button>
                <button id="btnEmlakjet" class="btn btn-portal btn-ej">
                    <span>E</span> Emlakjet
                </button>
                <button id="btnWhatsApp" class="btn btn-portal"
                    style="background: #25d366; color: white; grid-column: span 2;">
                    <span>W</span> WhatsApp Web Sync
                </button>
            </div>

            <button id="turboBtn" class="btn btn-turbo">🚀 TÜMÜNÜ BAŞLAT (TURBO)</button>
            <button id="stopBtn" class="btn btn-stop">⏹ HER ŞEYİ DURDUR</button>
        </div>

        <div class="footer-links" style="justify-content: space-between; padding: 0 10px;">
            <button id="testBtn" class="btn-link">Test Et</button>
            <button id="configBtn" class="btn-link">🔑 API Key</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
